<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Cardlopedia</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages serves this page for any missing address, at any depth, so it can't rely on
     relative links. It is self-contained and works out the site's base address below. -->
<style>
  :root { --bg: #f4f5f7; --surface: #fff; --ink: #14161b; --muted: #6a6f7c; --line: #e2e4e9; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1014; --surface: #171a20; --ink: #eceef2; --muted: #8b90a0; --line: #262a33; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Onest, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; display: grid; gap: 6px; }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -.02em; color: inherit; text-decoration: none; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); }
  .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .links a { padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" data-page="">Cardlopedia</a>
  <h1>This page doesn’t exist</h1>
  <p>The link may be old or mistyped.</p>
  <p class="links"><a href="/" data-page="">Search cards</a><a href="/advanced.html" data-page="advanced.html">Advanced search</a></p>
</main>
<script>
  // On username.github.io/<repo>/..., the site lives under /<repo>/; on a custom domain, at /.
  var parts = location.pathname.split('/');
  var base = /\.github\.io$/.test(location.hostname) && parts[1] ? '/' + parts[1] + '/' : '/';
  document.querySelectorAll('[data-page]').forEach(function (a) { a.href = base + a.getAttribute('data-page'); });
</script>
</body>
</html>
